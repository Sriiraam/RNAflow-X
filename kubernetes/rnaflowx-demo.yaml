apiVersion: v1
kind: Pod
metadata:
  name: rnaflowx-demo
  labels:
    app: rnaflowx
spec:
  restartPolicy: Never
  containers:
    - name: rnaflowx
      image: rnaflowx:1.0.0
      imagePullPolicy: Never
      command:
        - /bin/bash
        - -c
        - |
          echo "RNAFlowX Kubernetes Demo"
          echo "========================"
          fastqc --version
          fastp --version
          salmon --version
          multiqc --version
          Rscript --version
          echo "RNAFlowX container validated on Kubernetes"
