name: RNAFlowX CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:

  # ==========================================================
  # Python validation
  # ==========================================================
  python-validation:
    name: Python Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Compile Python source files
        run: |
          python -m py_compile \
            scripts/build_database.py \
            streamlit_app/utils/database.py \
            streamlit_app/pages/1_Quality_Control.py \
            streamlit_app/pages/2_Differential_Expression.py \
            streamlit_app/pages/3_Functional_Enrichment.py \
            streamlit_app/pages/4_GSEA.py

      - name: Run project tests
        run: pytest -v tests/test_project.py


  # ==========================================================
  # Nextflow validation
  # ==========================================================
  nextflow-validation:
    name: Nextflow DSL2 Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "25.10.4"

      - name: Show Nextflow version
        run: nextflow -version

      - name: Validate local configuration
        run: nextflow config -profile local > /dev/null

      - name: Validate Docker configuration
        run: nextflow config -profile docker > /dev/null

      - name: Validate SLURM configuration
        run: nextflow config -profile slurm > /dev/null

      - name: Validate Azure configuration
        run: nextflow config -profile azure > /dev/null

      - name: Validate workflow DAG
        run: |
          mkdir -p data/reference/salmon_index
          touch data/reference/tx2gene.tsv
          touch data/metadata.csv
          nextflow run main.nf -profile local -preview


  # ==========================================================
  # Docker build validation
  # ==========================================================
  docker-validation:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile
          push: false
          tags: rnaflowx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ==========================================================
  # Miniature end-to-end RNA-seq validation
  # ==========================================================
  end-to-end-validation:
    name: Miniature End-to-End Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: python -m pip install pandas

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "25.10.4"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load RNAFlowX container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile
          push: false
          load: true
          tags: rnaflowx:1.1.0
          cache-from: type=gha

      - name: Generate miniature RNA-seq dataset
        run: |
          python tests/generate_ci_data.py \
            --outdir tests/data/ci

      - name: Validate synthetic FASTQ files
        run: gzip -t tests/data/ci/fastq/*.fastq.gz

      - name: Build miniature Salmon index
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" \
            -w /work \
            rnaflowx:1.1.0 \
            salmon index \
              -t tests/data/ci/reference/transcripts.fa \
              -i tests/data/ci/reference/salmon_index \
              -k 31

      - name: Run miniature RNAFlowX pipeline
        run: |
          nextflow run main.nf \
            -profile docker \
            --samplesheet tests/data/ci/samplesheet.csv \
            --metadata tests/data/ci/metadata.csv \
            --tx2gene tests/data/ci/reference/tx2gene.tsv \
            --salmon_index tests/data/ci/reference/salmon_index \
            --outdir tests/results_ci \
            --skip_enrichment true

      - name: Validate expected biological outputs
        run: python tests/check_ci_outputs.py

      - name: Upload Nextflow diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rnaflowx-ci-diagnostics
          path: |
            .nextflow.log
            tests/results_ci/pipeline_info/
          if-no-files-found: ignore
